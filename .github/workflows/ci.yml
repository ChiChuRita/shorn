name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so "Vendors at latest" meets a vendor release within days rather than on the
  # next push, however long that is. Off the hour, when scheduled runs queue longest.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# Keyed by event as well as ref: a scheduled run is on main, so without the event name it
# would cancel a push run in progress there, or be cancelled by one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs. A major tag like @v4 moves, and a compromised
# upstream tag would run as this repository. Dependabot bumps the SHA and the
# version comment together (.github/dependabot.yml).
jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The seven examples plus the live-WebSocket demo are the surface the docs and
      # the launch posts point at, and nothing else exercises them: they are outside
      # tsconfig's `include`, and `node` strips their types without checking them.
      # They assert on their own output, so running them is the check. The demo opens
      # a listening socket on an ephemeral port and takes about four seconds.
      - run: pnpm examples

  vendors-latest:
    # shorn's promise is "the schema you already have", and what breaks that promise
    # is a validator release changing its JSON Schema output, as Zod 4.5 did (0.7.1).
    # The lockfile pins the vendors for reproducibility; this job ignores those pins
    # and runs the suite against whatever the registry serves today, so a vendor
    # change turns main red before a user reports it.
    name: Vendors at latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -w -D zod@latest valibot@latest arktype@latest @valibot/to-json-schema@latest
      - run: pnpm ls zod valibot arktype @valibot/to-json-schema --depth 0
      - run: pnpm test

  engines-floor:
    # `engines` says Node 20, and a floor CI cannot exercise is a claim rather than
    # a fact. pnpm 11 needs Node 22.13 to install, so the build runs on 22 and the
    # *built artifact* is then exercised on the floor itself, which is the only
    # thing `engines` actually promises a consumer.
    name: Engines floor (built artifact on Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Round-trip on Node 20
        run: |
          node --input-type=module -e '
            import { m } from "./dist/index.js";
            const s = m.object({ id: m.uint(), name: m.string(), tags: m.array(m.string()) });
            const value = { id: 7, name: "Ada", tags: ["x", "y"] };
            const got = s.decode(s.encode(value));
            if (JSON.stringify(got) !== JSON.stringify(value)) throw new Error("round-trip mismatch");
            try { m.uint().encode(-1); throw new Error("expected a throw"); } catch (e) {
              if (e.name !== "EncodeError") throw e;
            }
            console.log("Node", process.version, "ok");
          '

  bun:
    # The build is platform-neutral ESM, and the library looks two runtime facilities up
    # rather than importing them: `Buffer.prototype.utf8Slice` and
    # `String.prototype.isWellFormed`. Bun and Deno provide both through compatibility
    # layers of their own, so each gets the floor job's treatment: built on Node, then the
    # same round trip on the runtime's latest release.
    name: Built artifact on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Round-trip on Bun
        run: |
          bun --eval '
            import { m } from "./dist/index.js";
            const s = m.object({ id: m.uint(), name: m.string(), tags: m.array(m.string()) });
            const value = { id: 7, name: "Ada", tags: ["x", "y"] };
            const got = s.decode(s.encode(value));
            if (JSON.stringify(got) !== JSON.stringify(value)) throw new Error("round-trip mismatch");
            try { m.uint().encode(-1); throw new Error("expected a throw"); } catch (e) {
              if (e.name !== "EncodeError") throw e;
            }
            console.log("Bun", Bun.version, "ok");
          '

  deno:
    # As the Bun job, under Deno.
    name: Built artifact on Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
      - name: Round-trip on Deno
        run: |
          deno eval '
            import { m } from "./dist/index.js";
            const s = m.object({ id: m.uint(), name: m.string(), tags: m.array(m.string()) });
            const value = { id: 7, name: "Ada", tags: ["x", "y"] };
            const got = s.decode(s.encode(value));
            if (JSON.stringify(got) !== JSON.stringify(value)) throw new Error("round-trip mismatch");
            try { m.uint().encode(-1); throw new Error("expected a throw"); } catch (e) {
              if (e.name !== "EncodeError") throw e;
            }
            console.log("Deno", Deno.version.deno, "ok");
          '

  soak:
    # The deep property run: 50k generated schemas against every invariant. Too slow
    # for `pnpm check` on every save, cheap enough to run on every push.
    name: Property soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:soak
