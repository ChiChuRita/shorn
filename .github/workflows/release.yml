name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance. Without it `publishConfig.provenance` fails the
  # publish rather than silently skipping the attestation.
  id-token: write

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs the tags to work out what is already released.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Written by hand rather than by `setup-node`'s `registry-url`, which puts the
      # token in a temp file and points npm at it via NPM_CONFIG_USERCONFIG — a path
      # `pnpm publish` did not read, so it published unauthenticated and npm answered
      # with its browser-auth fallback (ERR_PNPM_OTP_NON_INTERACTIVE). ~/.npmrc is the
      # one location every tool in this job agrees on.
      - name: Authenticate to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or unset"
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> ~/.npmrc

      # Fail here, loudly, rather than fifteen lines into a publish. `whoami` is a
      # read: it proves the token authenticates, and says nothing about whether it may
      # publish, so a permissions problem still surfaces later — but an absent, typo'd
      # or revoked token stops being indistinguishable from a 2FA wall.
      - name: Prove the token authenticates
        run: pnpm whoami --registry https://registry.npmjs.org

      # Two states, one job. With changesets pending, the action opens or updates a
      # "Version Packages" PR and publishes nothing. With none pending — i.e. that PR
      # just merged — `publish` runs instead. `pnpm release` gates on `pnpm check`, so
      # a red test blocks the publish, and `changeset publish` skips versions already
      # on npm, so a re-run after a partial failure is safe.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Auth already lives in ~/.npmrc, written above. NPM_TOKEN stays so the
          # action does not decide the file is missing and write its own over it.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
