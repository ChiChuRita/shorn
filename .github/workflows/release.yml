name: Release

# A pushed tag is the release. `npm version <bump>` writes package.json, commits and
# cuts the tag in one step, so `git push --follow-tags` is the whole ceremony. There
# is no version PR to merge and no changeset to remember, because this repo publishes
# exactly one package and dropped changesets in 2c5d586.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # The only credential in this workflow. npm trusted publishing exchanges this OIDC
  # identity for a short-lived publish token, so no NPM_TOKEN exists to leak, rotate
  # or accidentally paste somewhere. It is also what signs the provenance attestation:
  # without id-token, `NPM_CONFIG_PROVENANCE` fails the publish rather than skipping it.
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      # First, before anything is installed or run. A manual run dispatched from a branch
      # would otherwise publish whatever version that branch's package.json names, with no
      # tag marking the commit. A v* tag passes whether it was pushed or the run was
      # dispatched on it, which is how a failed publish is retried. A shell pattern rather
      # than `startsWith`, which ignores case.
      - name: Only a v* tag publishes
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "releasing from $GITHUB_REF" ;;
            *)
              echo "::error::A release runs only on a v* tag, not on $GITHUB_REF. To retry one, dispatch this workflow on its tag."
              exit 1
              ;;
          esac

      # Pinned to commit SHAs, not major tags. Everything that runs in this job runs
      # one step before a publish signed with its OIDC identity, so a moved upstream
      # tag here would mean an artifact under this package's name with valid
      # provenance. Dependabot bumps the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing landed in npm 11.5.1. Node 24 bundles a newer npm, so this
      # asserts rather than installs: `npm install -g npm@latest` would fetch and run
      # unpinned registry code right before the publish, for the same reason the
      # actions above are pinned. If a runner image ever ships an older npm, this
      # fails loudly instead of quietly attempting an unauthenticated publish.
      - name: npm must support trusted publishing
        run: |
          NPM="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} predates trusted publishing (needs 11.5.1)`);
              process.exit(1);
            }
          ' "$NPM"
          echo "npm $NPM"

      - run: pnpm install --frozen-lockfile

      # `check`, not `verify`. Typecheck, tests, build and the pack lint are
      # deterministic and belong in front of a publish; `regress` measures wall-clock
      # throughput, which is noise on a shared runner and would fail releases for
      # reasons that have nothing to do with the artifact.
      - run: pnpm check

      # The tag says which version this is meant to be. If package.json disagrees, the
      # tag was cut by hand instead of by `npm version` and something is wrong, so better
      # to stop here than to publish a version nobody asked for. Every run that gets this
      # far is on a tag, so this runs every time.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # No NODE_AUTH_TOKEN. Authentication is the OIDC exchange above; a token here
      # would defeat the point of configuring a trusted publisher.
      - name: Publish
        run: npm publish
        env:
          NPM_CONFIG_PROVENANCE: true
